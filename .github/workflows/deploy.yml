name: Build and Deploy Fpilot UI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  workflow_dispatch:

concurrency:
  group: crm-chatbot-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-main
    if: github.ref == 'refs/heads/main'
    # Runs inside the production VPS: it only dials out to GitHub and builds the image locally.
    runs-on: [self-hosted, crm-anuni]
    timeout-minutes: 30
    env:
      CHATBOT_IMAGE: crm-chatbot:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # NEXT_PUBLIC_* values are baked into the client bundle at build time.
        run: |
          docker build \
            --label org.opencontainers.image.revision=${GITHUB_SHA} \
            --build-arg NEXT_PUBLIC_API_URL=https://api.faip.pro/ \
            --build-arg NEXT_PUBLIC_APP_URL=https://fpilot.faip.pro \
            --build-arg NEXT_PUBLIC_ENV=production \
            --build-arg NEXT_PUBLIC_COOKIE_DOMAIN=.faip.pro \
            --build-arg NEXT_PUBLIC_EMBED_ALLOWED_ORIGINS=https://crm.faip.pro,https://faip.pro \
            --build-arg NEXT_PUBLIC_EMBED_FULLSCREEN_URL=https://fpilot.faip.pro/chatbot \
            --tag "$CHATBOT_IMAGE" .

      - name: Deploy
        run: |
          install -m 644 deploy/compose.prod.yaml /opt/crm-chatbot/compose.prod.yaml
          install -m 755 deploy/deploy.sh /opt/crm-chatbot/deploy.sh
          /opt/crm-chatbot/deploy.sh "$CHATBOT_IMAGE"
